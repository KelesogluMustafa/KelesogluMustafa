<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
  <title id="title">PDFStruct — open-source, local-first document conversion (Python, MIT)</title>
  <desc id="desc">Pipeline: PDF, DOCX, images and HTML go in; each page uses native text or OCR; everything becomes a raw document model defined by a JSON Schema; any input exports to ten formats, including JSON, XLSX, CSV, SQLite, DOCX, HTML and Markdown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L5 10L10 0z" fill="#60A5FA"/>
    </marker>
    <clipPath id="frame"><rect width="600" height="500" rx="22"/></clipPath>
    <style>
      .sans { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
      .lbl { font-size: 15px; font-weight: 700; letter-spacing: 2px; fill: #64748B; }
      .chip { fill: #0F172A; stroke: #263247; }
      .chip-text { font-size: 18px; fill: #CBD5E1; text-anchor: middle; }
      .out { fill: #0E1E3A; stroke: #1E40AF; }
      .out-text { font-size: 18px; fill: #BFDBFE; text-anchor: middle; }
      .note { font-size: 19px; fill: #94A3B8; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="600" height="500" fill="url(#bg)"/>
    <rect width="600" height="500" fill="url(#grid)"/>
    <rect width="600" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="499" rx="21.5" fill="none" stroke="#1E293B"/>

  <text x="40" y="58" class="mono" font-size="16" font-weight="700" letter-spacing="3" fill="#60A5FA">03 · OPEN SOURCE</text>
  <text x="560" y="58" class="mono" font-size="16" fill="#94A3B8" text-anchor="end">Python · MIT</text>

  <text x="40" y="114" class="sans" font-size="46" font-weight="800" fill="#F8FAFC">PDFStruct</text>
  <text x="40" y="152" class="sans" font-size="22" fill="#94A3B8">Local-first document conversion</text>

  <!-- input -->
  <g class="mono">
    <text x="40" y="207" class="lbl">IN</text>
    <rect class="chip" x="96" y="182" width="62" height="38" rx="9"/><text class="chip-text" x="127" y="207">PDF</text>
    <rect class="chip" x="166" y="182" width="74" height="38" rx="9"/><text class="chip-text" x="203" y="207">DOCX</text>
    <rect class="chip" x="248" y="182" width="96" height="38" rx="9"/><text class="chip-text" x="296" y="207">Images</text>
    <rect class="chip" x="352" y="182" width="74" height="38" rx="9"/><text class="chip-text" x="389" y="207">HTML</text>
  </g>

  <line x1="60" y1="228" x2="60" y2="262" stroke="#60A5FA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="96" y="252" class="sans note">native text or OCR, per page</text>

  <!-- model -->
  <rect x="40" y="270" width="520" height="72" rx="12" fill="#0C1830" stroke="#1D4ED8"/>
  <text x="64" y="304" class="sans" font-size="23" font-weight="700" fill="#F8FAFC">Raw document model</text>
  <text x="64" y="330" class="mono" font-size="17" fill="#93C5FD">JSON Schema</text>

  <line x1="60" y1="350" x2="60" y2="384" stroke="#60A5FA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="96" y="374" class="sans note">any input → 10 formats</text>

  <!-- output -->
  <g class="mono">
    <text x="40" y="417" class="lbl">OUT</text>
    <rect class="out" x="96" y="392" width="74" height="38" rx="9"/><text class="out-text" x="133" y="417">JSON</text>
    <rect class="out" x="178" y="392" width="74" height="38" rx="9"/><text class="out-text" x="215" y="417">XLSX</text>
    <rect class="out" x="260" y="392" width="62" height="38" rx="9"/><text class="out-text" x="291" y="417">CSV</text>
    <rect class="out" x="330" y="392" width="96" height="38" rx="9"/><text class="out-text" x="378" y="417">SQLite</text>
    <rect class="out" x="96" y="438" width="74" height="38" rx="9"/><text class="out-text" x="133" y="463">DOCX</text>
    <rect class="out" x="178" y="438" width="74" height="38" rx="9"/><text class="out-text" x="215" y="463">HTML</text>
    <rect class="out" x="260" y="438" width="62" height="38" rx="9"/><text class="out-text" x="291" y="463">MD</text>
    <rect class="chip" x="330" y="438" width="96" height="38" rx="9"/><text class="chip-text" x="378" y="463">+3 more</text>
  </g>
</svg>
