<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title">
  <title id="title">Building practical software from idea to production. mustafakelesoglu.de</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="0.6" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="24"/></clipPath>
    <style>
      .sans { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <ellipse cx="600" cy="130" rx="520" ry="170" fill="url(#glow)"/>
    <rect y="257" width="1200" height="3" fill="url(#accent)" opacity="0.9"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="23.5" fill="none" stroke="#1E293B"/>

  <rect x="568" y="44" width="64" height="5" rx="2" fill="url(#accent)"/>
  <text x="600" y="110" class="sans" font-size="42" font-weight="800" fill="#F8FAFC" text-anchor="middle">Building practical software</text>
  <text x="600" y="162" class="sans" font-size="42" font-weight="800" fill="#F8FAFC" text-anchor="middle">from idea to production.</text>
  <text x="600" y="212" class="mono" font-size="24" fill="#22D3EE" text-anchor="middle">mustafakelesoglu.de</text>
