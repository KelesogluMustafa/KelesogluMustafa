<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Mustafa Keleşoğlu — Product Builder · Developer Tools · Web Applications</title>
  <desc id="desc">I build practical software, developer tools and production-ready web products. A terminal lists the products SaveFold, Lumera, PDFStruct and VisualStruct.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="0.6" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
    <style>
      .sans { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
      .row { font-size: 22px; font-weight: 700; fill: #F8FAFC; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="980" cy="150" r="320" fill="url(#glow)"/>
    <circle cx="160" cy="460" r="300" fill="url(#glow2)"/>
    <rect width="1200" height="3" fill="url(#accent)" opacity="0.9"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="23.5" fill="none" stroke="#1E293B"/>

  <!-- identity -->
  <rect x="64" y="84" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="62" y="168" class="sans" font-size="68" font-weight="800" fill="#F8FAFC" letter-spacing="-1">Mustafa Keleşoğlu</text>
  <text x="66" y="224" class="sans" font-size="26" font-weight="600" fill="#CBD5E1">Product Builder <tspan fill="#22D3EE">·</tspan> Developer Tools <tspan fill="#22D3EE">·</tspan> Web Applications</text>
  <text x="66" y="290" class="sans" font-size="25" fill="#94A3B8">I build practical software, developer tools</text>
  <text x="66" y="326" class="sans" font-size="25" fill="#94A3B8">and production-ready web products.</text>

  <!-- terminal -->
  <g>
    <rect x="812" y="76" width="324" height="268" rx="16" fill="#060A11" stroke="#263247"/>
    <path d="M812 92a16 16 0 0 1 16-16h292a16 16 0 0 1 16 16v26H812z" fill="#0D1422"/>
    <line x1="812" y1="118" x2="1136" y2="118" stroke="#1E293B"/>
    <circle cx="836" cy="97" r="5.5" fill="#F87171"/>
    <circle cx="855" cy="97" r="5.5" fill="#FBBF24"/>
    <circle cx="874" cy="97" r="5.5" fill="#34D399"/>

    <g class="mono">
      <text x="836" y="162" font-size="20" fill="#22D3EE">$ <tspan fill="#E2E8F0">ls products/</tspan></text>
      <circle cx="844" cy="198" r="6" fill="#22C55E"/>
      <text x="862" y="205" class="row">savefold</text>
      <circle cx="844" cy="236" r="6" fill="#C084FC"/>
      <text x="862" y="243" class="row">lumera</text>
      <circle cx="844" cy="274" r="6" fill="#60A5FA"/>
      <text x="862" y="281" class="row">pdfstruct</text>
      <circle cx="844" cy="312" r="6" fill="#818CF8"/>
      <text x="862" y="319" class="row">visualstruct</text>
      <rect class="cursor" x="1018" y="302" width="12" height="22" fill="#22D3EE"/>
    </g>
  </g>
</svg>
