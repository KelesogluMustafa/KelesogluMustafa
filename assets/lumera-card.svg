<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Lumera — mobile-first PWA for cycle and health journaling, in development</title>
  <desc id="desc">Cycle, tests, medication and notes in one calm calendar. Logs periods, tests and medication; estimates are shown as ranges; health records stay on the device. A calendar mock-up shows logged days as solid cells and estimates as dashed outlines. Not a diagnostic tool or contraceptive method. Built with Vite, vanilla JavaScript, a PHP 8 API and MariaDB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="0.6" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#120F24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="logged" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="600" rx="24"/></clipPath>
    <style>
      .sans { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
      .feature { font-size: 24px; fill: #CBD5E1; }
      .chip { fill: #0F172A; stroke: #2E2A4A; }
      .chip-text { font-size: 20px; fill: #CBD5E1; text-anchor: middle; }
      .day { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 20px; fill: #CBD5E1; text-anchor: middle; }
      .day-on { fill: #FFFFFF; font-weight: 700; }
      .day-today { fill: #0B1220; font-weight: 700; }
      .wd { font-size: 16px; fill: #64748B; text-anchor: middle; }
      .est-fertile { fill: #8B5CF6; fill-opacity: 0.10; stroke: #C4B5FD; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .est-period { fill: #EC4899; fill-opacity: 0.08; stroke: #F9A8D4; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .tab { font-size: 17px; fill: #64748B; text-anchor: middle; }
      .tab-on { fill: #E9D5FF; font-weight: 700; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="600" fill="url(#bg)"/>
    <rect width="1200" height="600" fill="url(#grid)"/>
    <circle cx="930" cy="330" r="340" fill="url(#glow)"/>
    <rect width="1200" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="23.5" fill="none" stroke="#1E293B"/>

  <!-- header -->
  <text x="64" y="74" class="mono" font-size="18" font-weight="700" letter-spacing="3" fill="#C084FC">02 · FEATURED PRODUCT</text>

  <g transform="translate(64 108) scale(1.143)">
    <rect width="56" height="56" rx="14" fill="#1E1638" stroke="#5B21B6"/>
    <circle cx="28" cy="28" r="14" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-dasharray="66 22" transform="rotate(-60 28 28)"/>
    <circle cx="28" cy="28" r="5" fill="#F472B6"/>
  </g>
  <text x="148" y="162" class="sans" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Lumera</text>

  <text x="64" y="218" class="sans" font-size="27" font-weight="600" fill="#94A3B8">Mobile-first PWA</text>
  <text x="64" y="262" class="sans" font-size="27" fill="#CBD5E1">Cycle, tests, medication and notes</text>
  <text x="64" y="298" class="sans" font-size="27" fill="#CBD5E1">in one calm calendar.</text>

  <!-- verified capabilities -->
  <g class="sans">
    <g transform="translate(64 330)">
      <rect width="32" height="32" rx="9" fill="#1E1638" stroke="#4C1D95"/>
      <path d="M9 16.5l4.5 4.5 9.5-10" fill="none" stroke="#C084FC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="24" class="feature">Logs periods, tests &amp; medication</text>
    </g>
    <g transform="translate(64 376)">
      <rect width="32" height="32" rx="9" fill="#1E1638" stroke="#4C1D95"/>
      <path d="M9 16.5l4.5 4.5 9.5-10" fill="none" stroke="#C084FC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="24" class="feature">Estimates shown as ranges</text>
    </g>
    <g transform="translate(64 422)">
      <rect width="32" height="32" rx="9" fill="#1E1638" stroke="#4C1D95"/>
      <path d="M9 16.5l4.5 4.5 9.5-10" fill="none" stroke="#C084FC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="24" class="feature">Health records stay on device</text>
    </g>
  </g>

  <text x="64" y="490" class="sans" font-size="18" fill="#7C8BA1">Not a diagnostic tool or contraceptive method.</text>

  <!-- stack -->
  <g class="mono">
    <rect class="chip" x="64" y="512" width="80" height="44" rx="12"/>
    <text class="chip-text" x="104" y="541">Vite</text>
    <rect class="chip" x="154" y="512" width="148" height="44" rx="12"/>
    <text class="chip-text" x="228" y="541">Vanilla JS</text>
    <rect class="chip" x="312" y="512" width="96" height="44" rx="12"/>
    <text class="chip-text" x="360" y="541">PHP 8</text>
    <rect class="chip" x="418" y="512" width="112" height="44" rx="12"/>
    <text class="chip-text" x="474" y="541">MariaDB</text>
  </g>

  <!-- status -->
  <g>
    <rect x="826" y="46" width="310" height="44" rx="22" fill="#1E1638" stroke="#6D28D9"/>
    <circle cx="852" cy="68" r="6" fill="#C084FC"/>
    <text x="870" y="76" class="sans" font-size="21" font-weight="600" fill="#DDD6FE">In development · private</text>
  </g>

  <!-- app mock-up: calendar -->
  <g>
    <rect x="724" y="108" width="412" height="456" rx="28" fill="#0A0F1A" stroke="#2E2A4A"/>
    <text x="748" y="154" class="sans" font-size="26" font-weight="700" fill="#F8FAFC">October</text>

    <g class="mono">
      <text x="762" y="180" class="wd">M</text>
      <text x="818" y="180" class="wd">T</text>
      <text x="874" y="180" class="wd">W</text>
      <text x="930" y="180" class="wd">T</text>
      <text x="986" y="180" class="wd">F</text>
      <text x="1042" y="180" class="wd">S</text>
      <text x="1098" y="180" class="wd">S</text>
    </g>

    <!-- logged = solid, estimates = dashed -->
    <rect x="850" y="192" width="48" height="42" rx="12" fill="url(#logged)"/>
    <text x="874" y="220" class="day day-on">1</text>
    <rect x="906" y="192" width="48" height="42" rx="12" fill="url(#logged)"/>
    <text x="930" y="220" class="day day-on">2</text>
    <rect x="962" y="192" width="48" height="42" rx="12" fill="url(#logged)"/>
    <text x="986" y="220" class="day day-on">3</text>
    <rect x="1018" y="192" width="48" height="42" rx="12" fill="url(#logged)"/>
    <text x="1042" y="220" class="day day-on">4</text>
    <rect x="1074" y="192" width="48" height="42" rx="12" fill="url(#logged)"/>
    <text x="1098" y="220" class="day day-on">5</text>
    <text x="762" y="270" class="day">6</text>
    <text x="818" y="270" class="day">7</text>
    <text x="874" y="270" class="day">8</text>
    <text x="930" y="270" class="day">9</text>
    <text x="986" y="270" class="day">10</text>
    <text x="1042" y="270" class="day">11</text>
    <rect x="1075" y="243" width="46" height="40" rx="11" class="est-fertile"/>
    <text x="1098" y="270" class="day">12</text>
    <rect x="739" y="293" width="46" height="40" rx="11" class="est-fertile"/>
    <text x="762" y="320" class="day">13</text>
    <rect x="795" y="293" width="46" height="40" rx="11" class="est-fertile"/>
    <text x="818" y="320" class="day">14</text>
    <circle cx="818" cy="328" r="3" fill="#22D3EE"/>
    <rect x="851" y="293" width="46" height="40" rx="11" class="est-fertile"/>
    <text x="874" y="320" class="day">15</text>
    <rect x="907" y="293" width="46" height="40" rx="11" class="est-fertile"/>
    <rect x="910" y="296" width="40" height="34" rx="9" fill="#F8FAFC"/>
    <text x="930" y="320" class="day day-today">16</text>
    <rect x="963" y="293" width="46" height="40" rx="11" class="est-fertile"/>
    <text x="986" y="320" class="day">17</text>
    <text x="1042" y="320" class="day">18</text>
    <text x="1098" y="320" class="day">19</text>
    <text x="762" y="370" class="day">20</text>
    <text x="818" y="370" class="day">21</text>
    <text x="874" y="370" class="day">22</text>
    <text x="930" y="370" class="day">23</text>
    <text x="986" y="370" class="day">24</text>
    <text x="1042" y="370" class="day">25</text>
    <text x="1098" y="370" class="day">26</text>
    <text x="762" y="420" class="day">27</text>
    <text x="818" y="420" class="day">28</text>
    <rect x="851" y="393" width="46" height="40" rx="11" class="est-period"/>
    <text x="874" y="420" class="day">29</text>
    <rect x="907" y="393" width="46" height="40" rx="11" class="est-period"/>
    <text x="930" y="420" class="day">30</text>
    <rect x="963" y="393" width="46" height="40" rx="11" class="est-period"/>
    <text x="986" y="420" class="day">31</text>

    <!-- legend -->
    <g class="sans" font-size="17" fill="#94A3B8">
      <rect x="748" y="456" width="24" height="18" rx="5" fill="url(#logged)"/>
      <text x="780" y="471">Logged</text>
      <rect x="866" y="456" width="24" height="18" rx="5" class="est-fertile"/>
      <text x="898" y="471">Estimate</text>
      <circle cx="1002" cy="465" r="5" fill="#22D3EE"/>
      <text x="1014" y="471">Test</text>
    </g>

    <line x1="724" y1="496" x2="1136" y2="496" stroke="#1E293B"/>
    <g class="sans">
      <text x="773" y="536" class="tab">Today</text>
      <text x="856" y="536" class="tab tab-on">Calendar</text>
      <text x="934" y="536" class="tab">Add</text>
      <text x="1009" y="536" class="tab">Insights</text>
      <text x="1092" y="536" class="tab">Profile</text>
      <rect x="822" y="547" width="68" height="3" rx="1.5" fill="#C084FC"/>
    </g>
  </g>
</svg>
