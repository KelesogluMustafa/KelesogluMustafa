<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Engineering approach: Build, Test, Ship, Operate</title>
  <desc id="desc">Lifecycle from idea to operation. Build: specs first, web apps and PWAs, CLIs and MCP tools. Test: unit tests, database tests, UI tests. Ship: CI on three operating systems, tagged releases, installers. Operate: staging first, smoke tests, admin panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="350" rx="24"/></clipPath>
    <style>
      .sans { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
      .step { font-size: 18px; font-weight: 700; letter-spacing: 2px; fill: #94A3B8; text-anchor: middle; }
      .col { fill: #0F172A; stroke: #1E293B; }
      .h { font-size: 36px; font-weight: 800; fill: #F8FAFC; }
      .li { font-size: 24px; fill: #CBD5E1; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="350" fill="url(#bg)"/>
    <rect width="1200" height="350" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="349" rx="23.5" fill="none" stroke="#1E293B"/>

  <!-- seven-step track -->
  <rect x="64" y="82" width="1072" height="3" rx="1.5" fill="url(#track)" opacity="0.8"/>
  <g class="mono">
    <text x="126" y="62" class="step">IDEA</text>
    <text x="252" y="62" class="step">BUILD</text>
    <text x="463" y="62" class="step">TEST</text>
    <text x="640" y="62" class="step">CI</text>
    <text x="737" y="62" class="step">RELEASE</text>
    <text x="838" y="62" class="step">DEPLOY</text>
    <text x="1011" y="62" class="step">OPERATE</text>
  </g>
  <g stroke="#070B12" stroke-width="3">
    <circle cx="126" cy="83.5" r="8" fill="#22D3EE"/>
    <circle cx="252" cy="83.5" r="8" fill="#22D3EE"/>
    <circle cx="463" cy="83.5" r="8" fill="#38BDF8"/>
    <circle cx="640" cy="83.5" r="8" fill="#3B82F6"/>
    <circle cx="737" cy="83.5" r="8" fill="#3B82F6"/>
    <circle cx="838" cy="83.5" r="8" fill="#6366F1"/>
    <circle cx="1011" cy="83.5" r="8" fill="#8B5CF6"/>
  </g>

  <!-- columns -->
  <g class="sans">
    <rect class="col" x="64" y="114" width="250" height="206" rx="16"/>
    <rect x="64" y="114" width="250" height="4" rx="2" fill="#22D3EE"/>
    <text x="90" y="170" class="h">Build</text>
    <text x="90" y="216" class="li">Specs first</text>
    <text x="90" y="254" class="li">Web apps, PWAs</text>
    <text x="90" y="292" class="li">CLIs, MCP tools</text>

    <rect class="col" x="338" y="114" width="250" height="206" rx="16"/>
    <rect x="338" y="114" width="250" height="4" rx="2" fill="#38BDF8"/>
    <text x="364" y="170" class="h">Test</text>
    <text x="364" y="216" class="li">Unit tests</text>
    <text x="364" y="254" class="li">Database tests</text>
    <text x="364" y="292" class="li">UI tests</text>

    <rect class="col" x="612" y="114" width="250" height="206" rx="16"/>
    <rect x="612" y="114" width="250" height="4" rx="2" fill="#3B82F6"/>
    <text x="638" y="170" class="h">Ship</text>
    <text x="638" y="216" class="li">CI on 3 OSes</text>
    <text x="638" y="254" class="li">Tagged releases</text>
    <text x="638" y="292" class="li">Installers</text>

    <rect class="col" x="886" y="114" width="250" height="206" rx="16"/>
    <rect x="886" y="114" width="250" height="4" rx="2" fill="#8B5CF6"/>
    <text x="912" y="170" class="h">Operate</text>
    <text x="912" y="216" class="li">Staging first</text>
    <text x="912" y="254" class="li">Smoke tests</text>
    <text x="912" y="292" class="li">Admin panels</text>
  </g>
</svg>
